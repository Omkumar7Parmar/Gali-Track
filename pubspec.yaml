name: galitrack
description: "Privacy-first walking tracker for Indian streets."
publish_to: 'none'

# versionName+versionCode. Bump the build number (after +) for every Play upload.
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  # Local and CI must use the same Flutter (see .github/workflows/ci.yml).
  flutter: ">=3.41.2"

dependencies:
  clock: ^1.1.2
  # drift 2.35+ needs meta ^1.18, but Flutter 3.41.2 pins meta 1.17.0.
  # Lift this cap (and drift_dev's) together with the next Flutter upgrade.
  drift: ">=2.34.4 <2.35.0"
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2
  # @immutable for value types in the Flutter-free core/ layer.
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  # Pure-Dart Riverpod, so core/ and data/ can use providers without importing Flutter.
  riverpod: ^3.3.2

dev_dependencies:
  build_runner: ^2.15.1
  # Must stay on the same minor version as drift.
  drift_dev: ">=2.34.0 <2.35.0"
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  # Pinned exactly: analysis_options.yaml includes the 10.2.0 rule file by name.
  very_good_analysis: 10.2.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (configured in l10n.yaml).
  generate: true
