# Strict baseline on very_good_analysis (VGA), plus the bug classes that fail
# silently promoted from info to error.
#
# When bumping very_good_analysis: change the include filename in the SAME
# commit and check the file exists, otherwise analysis runs with ZERO rules:
#   ls ~/.pub-cache/hosted/pub.dev/very_good_analysis-*/lib/
include: package:very_good_analysis/analysis_options.10.2.0.yaml

# No `language:` block: VGA already sets strict-casts, strict-inference and
# strict-raw-types.

analyzer:
  exclude:
    # Generated code. Keep this list in sync with coverage filtering in CI.
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - "**/generated_plugin_registrant.dart"
    # Drift schema snapshots are migration-test baselines; never reformat them.
    - "test/drift/generated/**"

  errors:
    # Dropped Futures: an operation that silently never happens.
    unawaited_futures: error
    discarded_futures: error
    # Swallowed failures.
    empty_catches: error
    avoid_catches_without_on_clauses: error
    only_throw_errors: error
    throw_in_finally: error
    # Using a dead BuildContext after an await.
    use_build_context_synchronously: error
    # Resource leaks (VGA ships close_sinks at `ignore`; re-promoted here).
    cancel_subscriptions: error
    close_sinks: error
    # Type holes at dynamic boundaries.
    avoid_dynamic_calls: error
    always_declare_return_types: error
    cast_nullable_to_non_nullable: error
    # Enum switches must cover every case.
    exhaustive_cases: error
    # Shipping hygiene.
    avoid_print: error
    avoid_slow_async_io: error

    # Decision: this is an app with no external consumers, so docs are NOT
    # required on every public member. The seams (repositories, value types,
    # notifiers, services) are still documented, enforced in review.
    public_member_api_docs: ignore

    # Deliberately not errors.
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning
    lines_longer_than_80_chars: ignore

# Riverpod lints on the first-party analyzer plugin system (no custom_lint).
plugins:
  riverpod_lint:
    version: ^3.1.0
    diagnostics:
      missing_provider_scope: true
      avoid_ref_inside_state_dispose: true
      # Generator-only rules; this project writes providers by hand.
      avoid_build_context_in_providers: false
      provider_dependencies: false
      functional_ref: false
      notifier_extends: false
      notifier_build: false

formatter:
  trailing_commas: preserve
